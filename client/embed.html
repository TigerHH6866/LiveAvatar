<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LiveAvatar Embed</title>
    <style>
      /* 透明数字人：页面本身不带任何背景，宿主看到的就是人物轮廓 */
      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
      }

      #wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #bg {
        position: absolute;
        inset: 0;
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
      }

      #stage {
        position: relative;
        display: block;
        height: 100%;
        width: auto;
        max-width: 100%;
        max-height: 100%;
      }

      .hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="bg"></div>
      <canvas id="stage"></canvas>
      <video id="source" class="hidden" playsinline muted preload="auto" crossorigin="anonymous"></video>
      <video id="mask" class="hidden" playsinline muted preload="auto" crossorigin="anonymous"></video>
    </div>
    <script type="module" src="./embed.js"></script>
  </body>
</html>
